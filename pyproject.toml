[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "poc-util"
version = "0.1.0"
description = "CLI to initialize JFrog POC (Worker, Watch, Policy, Webhook) and sync Artifactory artifacts"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "POC" }]
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "responses>=0.23",
]

[project.scripts]
poc-util = "poc_util.cli:cli"

[tool.hatch.build.targets.wheel]
only-packages = true

[tool.hatch.build.targets.sdist]
only-packages = true

[tool.hatch.envs.default]
dependencies = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "responses>=0.23",
]
[tool.hatch.envs.default.scripts]
test = "pytest tests/ -v"
test-cov = "pytest tests/ -v --cov=poc_util --cov-report=term-missing"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["poc_util"]
branch = true

[tool.coverage.report]
exclude_lines = ["if TYPE_CHECKING:", "raise NotImplementedError"]
